name: linux-check
# Fast Linux compile gate: type-checks every Linux #[cfg] branch on real Ubuntu
# (macOS `cargo check` only compiles the macOS arms). No signing secrets, no
# frontend build, no bundling — just `cargo check` on both Linux arches.
on:
  push:
    branches: ["feat/linux-port"]
  workflow_dispatch:
jobs:
  cargo-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
