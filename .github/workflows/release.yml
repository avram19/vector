name: release

# Auto-release on version bump. When a merge to main lands a new version in
# package.json (i.e. no matching vX.Y.Z tag exists yet), build + sign every
# platform and publish a GitHub release with the updater manifest (latest.json).
# Ordinary merges that don't change the version do nothing.
#
# Requires two repo secrets (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.config/vector-updater/private.ke
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  that key's passphrase
#
# macOS ships unsigned (Gatekeeper warning); Linux AppImage needs no signing.
# Windows is intentionally excluded until Milestone 2 (windows.rs is stubbed).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags for the version check and notes
      - id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Guard: all three version files must agree. tauri-action builds from
          # tauri.conf.json, so a mismatch ships mislabeled artifacts (as v0.4.1 did).
          TAURI_V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_V=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$VERSION" != "$TAURI_V" ] || [ "$VERSION" != "$CARGO_V" ]; then
            echo "::error::Version mismatch — package.json=$VERSION tauri.conf.json=$TAURI_V Cargo.toml=$CARGO_V"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already tagged — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          # Auto notes: commit subjects since the previous tag, minus housekeeping.
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -1)
          RANGE=$([ -n "$PREV" ] && echo "${PREV}..HEAD" || echo "HEAD")
          {
            echo "notes<<__EOF__"
            git log --no-merges --pretty='- %s' "$RANGE" \
              | grep -viE '^- (release|chore|docs\(sdd\)):' | head -60
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # tauri-action builds + signs, creates/updates the release by tagName, uploads
      # each platform's bundle, and generates/merges latest.json for the updater.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.gate.outputs.version }}
          releaseName: Vector v${{ needs.gate.outputs.version }}
          releaseBody: ${{ needs.gate.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
